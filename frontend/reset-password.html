<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Zero-Knowledge KYC Vault</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>
<body class="auth-page">

  <header class="app-header">
    <div class="logo-group">
      <div class="logo-icon">ZK</div>
      <div class="logo-text">
        <h1>Zero-Knowledge KYC Vault</h1>
        <span>Cryptographically Isolated Storage</span>
      </div>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
        </div>
        <h2>Set New Password</h2>
        <p>Enter the code from your email and choose a new password</p>
      </div>

      <div id="reset-error" class="auth-alert auth-alert-error"></div>
      <div id="reset-success" class="auth-alert auth-alert-success"></div>

      <form id="reset-form" class="auth-form" novalidate>
        <div class="otp-info">
          Enter verification code sent to <strong id="reset-email-masked">your email</strong>
        </div>

        <div class="otp-box-container" id="reset-otp-boxes">
          <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 1" data-index="0">
          <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 2" data-index="1">
          <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 3" data-index="2">
          <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 4" data-index="3">
          <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 5" data-index="4">
          <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 6" data-index="5">
        </div>

        <div class="form-group">
          <label for="reset-new-password" class="form-label">New Password</label>
          <div class="input-wrapper">
            <input type="password" id="reset-new-password" class="form-input" placeholder="Min. 10 characters" required autocomplete="new-password">
            <button type="button" class="btn-toggle-vis" data-target="reset-new-password">Show</button>
          </div>
          <div class="password-strength" id="reset-strength-bar">
            <div class="password-strength-fill" id="reset-strength-fill"></div>
          </div>
          <div class="password-strength-text" id="reset-strength-text"></div>
        </div>

        <div class="form-group">
          <label for="reset-confirm-password" class="form-label">Confirm New Password</label>
          <div class="input-wrapper">
            <input type="password" id="reset-confirm-password" class="form-input" placeholder="Re-enter new password" required autocomplete="new-password">
            <button type="button" class="btn-toggle-vis" data-target="reset-confirm-password">Show</button>
          </div>
        </div>

        <button type="submit" id="reset-submit-btn" class="btn-auth-submit btn-success-auth">
          Reset Password
        </button>
      </form>

      <div class="auth-links">
        <a href="login.html">← Back to Sign In</a>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    Zero-Knowledge KYC Vault &bull; Client-Side Web Crypto AES-256-GCM Architecture &bull; No key escrow.
  </footer>

  <div id="toast-container" aria-live="polite"></div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
