<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Zero-Knowledge KYC Vault</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>
<body class="auth-page">

  <header class="app-header">
    <div class="logo-group">
      <div class="logo-icon">ZK</div>
      <div class="logo-text">
        <h1>Zero-Knowledge KYC Vault</h1>
        <span>Cryptographically Isolated Storage</span>
      </div>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        </div>
        <h2>Create Your Account</h2>
        <p>Register to start storing encrypted KYC documents</p>
      </div>

      <div id="register-error" class="auth-alert auth-alert-error"></div>
      <div id="register-success" class="auth-alert auth-alert-success"></div>

      <form id="register-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="reg-fullname" class="form-label">Full Name</label>
          <input type="text" id="reg-fullname" class="form-input" placeholder="Your full name" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="reg-username" class="form-label">Username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="Choose a unique username" required autocomplete="username">
          <div class="password-strength-text" id="username-hint" style="display:none;"></div>
        </div>

        <div class="form-group">
          <label for="reg-email" class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="reg-password" class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="reg-password" class="form-input" placeholder="Min. 10 characters, mix of types" required autocomplete="new-password">
            <button type="button" class="btn-toggle-vis" data-target="reg-password">Show</button>
          </div>
          <div class="password-strength" id="password-strength-bar">
            <div class="password-strength-fill" id="password-strength-fill"></div>
          </div>
          <div class="password-strength-text" id="password-strength-text"></div>
        </div>

        <div class="form-group">
          <label for="reg-confirm-password" class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-enter your password" required autocomplete="new-password">
            <button type="button" class="btn-toggle-vis" data-target="reg-confirm-password">Show</button>
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="reg-terms" required>
          <label for="reg-terms">I agree to the <a href="#" onclick="return false;">Terms of Service</a> and <a href="#" onclick="return false;">Privacy Policy</a></label>
        </div>

        <button type="submit" id="register-submit-btn" class="btn-auth-submit btn-success-auth">
          Create Account
        </button>
      </form>

      <div class="auth-links">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    Zero-Knowledge KYC Vault &bull; Client-Side Web Crypto AES-256-GCM Architecture &bull; No key escrow.
  </footer>

  <div id="toast-container" aria-live="polite"></div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
