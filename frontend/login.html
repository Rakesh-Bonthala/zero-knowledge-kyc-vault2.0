<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Zero-Knowledge KYC Vault</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>

<body class="auth-page">

  <header class="app-header">
    <div class="logo-group">
      <div class="logo-icon">ZK</div>
      <div class="logo-text">
        <h1>Zero-Knowledge KYC Vault</h1>
        <span>Cryptographically Isolated Storage</span>
      </div>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>
        <h2>Sign In to Your Vault</h2>
        <p>Enter your credentials to access encrypted documents</p>
      </div>

      <div id="login-error" class="auth-alert auth-alert-error"></div>
      <div id="login-success" class="auth-alert auth-alert-success"></div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="login-identifier" class="form-label">Username or Email</label>
          <input type="text" id="login-identifier" class="form-input" placeholder="Enter your username or email"
            required autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required
              autocomplete="current-password">
            <button type="button" class="btn-toggle-vis" data-target="login-password">Show</button>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn-auth-submit">
          Sign In
        </button>
      </form>

      <div class="auth-links">
        <a href="forgot-password.html">Forgot password?</a>
        <div class="auth-divider"></div>
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    Zero-Knowledge KYC Vault &bull; Client-Side Web Crypto AES-256-GCM Architecture &bull; No key escrow.
  </footer>

  <div id="toast-container" aria-live="polite"></div>

  <script type="module" src="js/auth.js"></script>
</body>

</html>
