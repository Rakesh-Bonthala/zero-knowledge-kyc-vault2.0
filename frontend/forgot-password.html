<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Zero-Knowledge KYC Vault</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>
<body class="auth-page">

  <header class="app-header">
    <div class="logo-group">
      <div class="logo-icon">ZK</div>
      <div class="logo-text">
        <h1>Zero-Knowledge KYC Vault</h1>
        <span>Cryptographically Isolated Storage</span>
      </div>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <h2>Reset Your Password</h2>
        <p>Enter your email and we'll send a verification code</p>
      </div>

      <div id="forgot-error" class="auth-alert auth-alert-error"></div>
      <div id="forgot-success" class="auth-alert auth-alert-success"></div>

      <form id="forgot-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="forgot-email" class="form-label">Email Address</label>
          <input type="email" id="forgot-email" class="form-input" placeholder="Enter your registered email" required autocomplete="email" autofocus>
        </div>

        <button type="submit" id="forgot-submit-btn" class="btn-auth-submit">
          Send Reset Code
        </button>
      </form>

      <div class="auth-links">
        <a href="login.html">← Back to Sign In</a>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    Zero-Knowledge KYC Vault &bull; Client-Side Web Crypto AES-256-GCM Architecture &bull; No key escrow.
  </footer>

  <div id="toast-container" aria-live="polite"></div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
